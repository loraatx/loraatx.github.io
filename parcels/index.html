<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parcelizer — City Anatomy</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="./style.css" rel="stylesheet" />
</head>
<body>

  <div id="map"></div>

  <div id="zoom-hint" class="zoom-hint" hidden>Zoom in to view parcels</div>

  <a class="map-brand" href="/index.html">City Anatomy</a>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-handle" aria-hidden="true">
      <span class="drawer-handle-grip"></span>
    </div>

    <header class="drawer-header">
      <div class="drawer-title">
        <span class="drawer-eyebrow">Parcel</span>
        <h2 id="drawer-parcel-id">—</h2>
      </div>
      <button id="drawer-close" class="drawer-close" type="button" aria-label="Close report">&times;</button>
    </header>

    <nav class="tab-bar" role="tablist" aria-label="Parcel report sections">
      <button class="tab is-active" role="tab" data-tab="constraints" aria-selected="true">Constraints</button>
      <button class="tab"           role="tab" data-tab="cases"       aria-selected="false">Cases &amp; Votes</button>
      <button class="tab"           role="tab" data-tab="ask"         aria-selected="false">Ask</button>
    </nav>

    <div class="tab-panels">
      <section class="tab-panel is-active" role="tabpanel" data-panel="constraints">
        <div class="panel-loading" hidden>Loading…</div>
        <div class="panel-error"   hidden></div>
        <div class="panel-body"></div>
      </section>
      <section class="tab-panel" role="tabpanel" data-panel="cases" hidden>
        <p class="tab-empty">Coming soon — board cases and votes that affected this parcel will appear here once the board scraper is online.</p>
      </section>
      <section class="tab-panel" role="tabpanel" data-panel="ask" hidden>
        <p class="tab-empty">Coming soon — ask natural-language questions about this parcel and get answers cited from the public meeting record.</p>
      </section>
    </div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script src="./drawer.js"></script>
  <script src="./app.js"></script>
</body>
</html>
