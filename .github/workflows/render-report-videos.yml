name: Render Report Promo Videos

on:
  push:
    branches: [main]
    paths:
      - "content/report-videos/src/**"
      - "content/report-videos/package.json"
  workflow_dispatch:
    inputs:
      report:
        description: "Report slug to render (leave blank to render all)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - austin-bike-shops
          - austin-chambers
          - austin-golf-courses
          - austin-horseback-riding
          - austin-neighborhoods
          - austin-ps5-bundles
          - austin-toy-stores
          - austin-vintage-guitar
          - pool-openings

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: content/report-videos/package-lock.json

      - name: Install dependencies
        working-directory: content/report-videos
        run: npm ci

      - name: Install Chromium for Remotion
        working-directory: content/report-videos
        run: npx remotion browser ensure

      - name: Render videos
        working-directory: content/report-videos
        run: |
          REPORT="${{ github.event.inputs.report }}"
          if [ -n "$REPORT" ]; then
            echo "Rendering single report: $REPORT"
            npm run render:$REPORT
          else
            echo "Rendering all reports"
            npm run render:all
          fi

      - name: Commit rendered videos to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/reports/*/storymap/promo.mp4 apps/reports/PoolOpenings/storymap/promo.mp4
          if git diff --cached --quiet; then
            echo "No video changes to commit."
          else
            git commit -m "chore: render report promo videos [skip ci]"
            git push origin main
          fi
