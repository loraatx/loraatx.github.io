name: Refresh Sellable Lists

# Refreshes the materialized views that back the sellable list products
# (see services/lists/). Each SKU's view is rebuilt and a row is appended
# to public.list_runs for audit + the public "last refreshed" timestamp.
#
# Currently shipped:
#   B1  list_contractor_active_permits  — weekly (Mondays 09:00 UTC)
#
# This workflow assumes:
#   - scripts/parcels_schema.sql has been applied (creates permits + list_runs)
#   - scripts/sql/load_permits_from_socrata.sql has been applied once
#     (schedules the pg_cron loader; the cron keeps the permits table fresh)
#
# Required repo secret:
#   SUPABASE_DB_PASSWORD  — same secret used by load-zoning.yml
#
# Trigger from the GitHub UI (Actions tab → "Refresh Sellable Lists") or wait
# for the weekly schedule. Idempotent.

on:
  workflow_dispatch:
  schedule:
    # Mondays 09:00 UTC ≈ Mondays 04:00/03:00 America/Chicago.
    - cron: '0 9 * * 1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST:     aws-1-us-west-1.pooler.supabase.com
      PGPORT:     "5432"
      PGUSER:     postgres.tqnklodtiithbsxxyycp
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      - name: Verify required secret is present
        run: |
          : "${PGPASSWORD:?SUPABASE_DB_PASSWORD secret missing}"

      - name: Refresh materialized views
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql/refresh_lists.sql

      - name: Stale-upstream sanity check
        # Alert if the latest row count for any SKU drops by > 30% vs. the
        # prior run. Catches Socrata schema breaks or an empty-permits day.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          with ranked as (
            select list_slug, row_count, ran_at,
                   lag(row_count) over (partition by list_slug order by ran_at) as prev
              from public.list_runs
          ),
          latest as (
            select distinct on (list_slug) list_slug, row_count, prev, ran_at
              from ranked
             order by list_slug, ran_at desc
          )
          select list_slug,
                 row_count,
                 prev,
                 ran_at,
                 case
                   when prev is null then 'first run'
                   when prev = 0     then 'prev was zero'
                   when row_count < prev * 0.7
                     then 'WARN: row count dropped >30% vs prior run'
                   else 'ok'
                 end as status
            from latest;
          SQL

      - name: Build CSV exports + sample teasers
        run: |
          python3 scripts/build-list-csv.py \
            --slug contractor_active_permits \
            --out  exports/contractor_active_permits.csv \
            --sample-out content/list-samples/contractor_active_permits.csv \
            --sample-rows 20

      - name: Upload export artifacts
        uses: actions/upload-artifact@v4
        with:
          name: list-exports
          path: exports/
          retention-days: 14

      - name: Commit refreshed sample teasers
        run: |
          if [ -n "$(git status --porcelain content/list-samples/)" ]; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add content/list-samples/
            git commit -m 'Refresh list sample teasers'
            git push
          else
            echo 'No sample changes to commit.'
          fi
